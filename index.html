<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>투네이션 완벽 연동 현황판</title>
</head>
<body>
    <!-- ⚠️ 이 페이지는 프리즘에 직접 등록하는 페이지가 아닙니다! -->
    <script>
        // 투네이션 공식 웹페이지 내부망에 검은색 현황판을 강제로 덧붙이는 마법의 장치
        (function() {
            'use strict';

            // 1. 질문자님의 원래 2x2 검은색 디자인 스타일 강제 주입
            const style = document.createElement('style');
            style.innerHTML = `
                .widget-container { background-color: #22252a; border-radius: 16px; padding: 24px; width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); color: #ffffff; position: absolute; top: 20px; left: 20px; z-index: 999999; font-family: 'Malgun Gothic', sans-serif; }
                .widget-header { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: left; }
                .allowance-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
                .allowance-amount { font-size: 28px; font-weight: 800; color: #f1c40f; }
                .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
                .status-card { background-color: #2c3036; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
                .status-label { font-size: 14px; color: #d1d5db; font-weight: bold; }
                .status-value { font-size: 22px; font-weight: bold; }
                .val-smoke-stack { color: #e67e22; } .val-quit-smoke { color: #2ecc71; } .val-fail { color: #f1c40f; } .val-none { color: #95a5a6; }
            `;
            document.head.appendChild(style);

            // 2. 📋 돼지유사료값 레이아웃 틀을 투네이션 화면에 강제로 꽂아넣기
            const container = document.createElement('div');
            container.className = 'widget-container';
            container.innerHTML = `
                <div class="widget-header"><span>📋 돼지유사료값3</span></div>
                <div class="allowance-section"><span class="allowance-title">누적 용돈</span><span class="allowance-amount" id="moneyText">0원</span></div>
                <div class="status-grid">
                    <div class="status-card"><span class="status-label">흡연스택</span><span class="status-value val-smoke-stack" id="smokeStack">0</span></div>
                    <div class="status-card"><span class="status-label">금연스택</span><span class="status-value val-quit-smoke" id="quitSmoke">0</span></div>
                    <div class="status-card"><span class="status-label">먹어</span><span class="status-value val-fail" id="eatCount">0</span></div>
                    <div class="status-card"><span class="status-label">먹지마</span><span class="status-value val-none" id="noEatCount">0</span></div>
                </div>
            `;
            document.body.appendChild(container);

            // 3. 변수 및 실시간 계산 엔진 가동
            let currentMoney = 0; let smokeStack = 0; let quitSmoke = 0; let eatCount = 0; let noEatCount = 0;

            function updateUI() {
                document.getElementById('moneyText').innerText = "+" + currentMoney.toLocaleString() + '원';
                document.getElementById('smokeStack').innerText = smokeStack;
                document.getElementById('quitSmoke').innerText = quitSmoke;
                document.getElementById('eatCount').innerText = eatCount;
                document.getElementById('noEatCount').innerText = noEatCount;
            }

            // 4. [치명적 핵심] 투네이션 공식 알림창 본사 내부에서 날아오는 오리지널 이벤트를 가로챔 (보안 차단 불가능)
            window.addEventListener('message', function(e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data && data.action === 'alert') {
                        const amount = parseInt(data.amount) || 0;
                        const message = data.comment || data.message || "";

                        if (amount > 0) {
                            currentMoney += amount;
                            if (amount >= 1000) {
                                if (message.includes("흡연")) { smokeStack += 1; }
                                if (message.includes("금연")) { quitSmoke += 1; }
                                if (message.includes("먹어")) { eatCount += 1; }
                                if (message.includes("먹지마")) { noEatCount += 1; }
                            }
                            updateUI(); // 화면 자석판 갈아끼우기
                        }
                    }
                } catch(err) {}
            });
        })();
    </script>
</body>
</html>
